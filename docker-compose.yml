# ============================================================
#  DevFlow — Local Development Infrastructure
#  Run: docker-compose up -d
#  Stop: docker-compose down
#  Clean: docker-compose down -v
# ============================================================

services:

  # ──────────────────────────────────────────
  # DATABASE
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: devflow-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-devflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devflow123}
      POSTGRES_DB: devflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-devflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devflow-network
    restart: unless-stopped

  # ──────────────────────────────────────────
  # CACHE
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: devflow-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devflow-network
    restart: unless-stopped

  # ──────────────────────────────────────────
  # MESSAGE BROKER
  # ──────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: devflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - devflow-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: devflow-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - devflow-network
    restart: unless-stopped

  # ──────────────────────────────────────────
  # SEARCH ENGINE
  # ──────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: devflow-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=devflow-cluster
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - devflow-network
    restart: unless-stopped

  # ──────────────────────────────────────────
  # DEV TOOLS
  # ──────────────────────────────────────────

  # Kafka UI — http://localhost:8090
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: devflow-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: devflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - devflow-network
    restart: unless-stopped

  # MailHog — SMTP local: localhost:1025 | UI: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: devflow-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - devflow-network
    restart: unless-stopped

  # ──────────────────────────────────────────
  # MONITORING
  # ──────────────────────────────────────────

  # Prometheus — http://localhost:9090
  prometheus:
    image: prom/prometheus:latest
    container_name: devflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - devflow-network
    restart: unless-stopped

  # Grafana — http://localhost:3000 (admin / admin123)
  grafana:
    image: grafana/grafana:latest
    container_name: devflow-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - devflow-network
    restart: unless-stopped

# ──────────────────────────────────────────
# VOLUMES
# ──────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:

# ──────────────────────────────────────────
# NETWORKS
# ──────────────────────────────────────────
networks:
  devflow-network:
    driver: bridge
    name: devflow-network
